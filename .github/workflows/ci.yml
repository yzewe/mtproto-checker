name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: gofmt -l ./cmd ./internal | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go build ./...
